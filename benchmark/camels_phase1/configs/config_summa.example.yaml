# Multi-engine benchmark — SUMMA leg  [EXAMPLE — fill in the paths]
#
# Copy to configs/config_summa.yaml and set the absolute paths below. Needs a real
# SUMMA-hydro binary (a bare `summa` on macOS PATH is an unrelated coreutil and is
# intentionally not accepted by the harness). SUMMA routes through mizuRoute.
SYMFLUENCE_DATA_DIR: /path/to/SYMFLUENCE_data
SYMFLUENCE_CODE_DIR: /path/to/SYMFLUENCE
NUM_PROCESSES: 1
DEBUG_MODE: false
LOG_LEVEL: INFO
LOG_TO_FILE: true
LOG_FORMAT: detailed
FORCE_RUN_ALL_STEPS: false
USE_LOCAL_SCRATCH: false
STOP_ON_ERROR: true
DOMAIN_NAME: multimodel_benchmark
EXPERIMENT_ID: summa_run
EXPERIMENT_TIME_START: 2002-01-01 01:00
EXPERIMENT_TIME_END: 2009-12-31 23:00
CALIBRATION_PERIOD: 2004-01-01, 2007-12-31
EVALUATION_PERIOD: 2008-01-01, 2009-12-31
SPINUP_PERIOD: 2002-01-01, 2003-12-31
DOMAIN_DEFINITION_METHOD: lumped
SUB_GRID_DISCRETIZATION: GRUS
ROUTING_DELINEATION: lumped
POUR_POINT_COORDS: 51.1722/-115.5717
BOUNDING_BOX_COORDS: 51.76/-116.55/50.95/-115.5
BUILD_MODEL_READY_STORE: true
MODEL_READY_FORCING_STRATEGY: symlink
FORCING_DATASET: ERA5
FORCING_TIME_STEP_SIZE: 3600
PET_METHOD: oudin

HYDROLOGICAL_MODEL: SUMMA
ROUTING_MODEL: mizuRoute

# --- SUMMA ---
SUMMA_INSTALL_PATH: /path/to/SYMFLUENCE_data/installs/summa/bin
SUMMA_EXE: summa_sundials.exe
SETTINGS_SUMMA_PATH: default
SETTINGS_SUMMA_FILEMANAGER: fileManager.txt
SETTINGS_SUMMA_FORCING_LIST: forcingFileList.txt
SETTINGS_SUMMA_COLDSTATE: coldState.nc
SETTINGS_SUMMA_TRIALPARAMS: trialParams.nc
SETTINGS_SUMMA_ATTRIBUTES: attributes.nc
SETTINGS_SUMMA_OUTPUT: outputControl.txt
SETTINGS_SUMMA_BASIN_PARAMS_FILE: basinParamInfo.txt
SETTINGS_SUMMA_LOCAL_PARAMS_FILE: localParamInfo.txt
SETTINGS_SUMMA_CONNECT_HRUS: false
SETTINGS_SUMMA_TRIALPARAM_N: 0
EXPERIMENT_OUTPUT_SUMMA: default
EXPERIMENT_LOG_SUMMA: default
PARAMS_TO_CALIBRATE: tempCritRain,frozenPrecipMultip,k_soil,k_macropore,theta_sat,aquiferBaseflowExp,aquiferBaseflowRate,qSurfScale,summerLAI,routingGammaShape,routingGammaScale
BASIN_PARAMS_TO_CALIBRATE: basin__aquiferHydCond,basin__aquiferBaseflowExp,routingGammaShape,routingGammaScale
SUMMA_DECISION_OPTIONS: {}
CALIBRATE_DEPTH: false
SUMMA_TIMEOUT: 7200

# --- mizuRoute (lumped, pass-through) ---
MIZUROUTE_INSTALL_PATH: default
MIZUROUTE_EXE: mizuroute.exe
SETTINGS_MIZU_PATH: default
SETTINGS_MIZU_WITHIN_BASIN: 0
SETTINGS_MIZU_ROUTING_DT: 3600
SETTINGS_MIZU_ROUTING_VAR: averageRoutedRunoff
SETTINGS_MIZU_OUTPUT_FREQ: single
SETTINGS_MIZU_OUTPUT_VARS: '1'
SETTINGS_MIZU_TOPOLOGY: topology.nc
SETTINGS_MIZU_PARAMETERS: param.nml.default
SETTINGS_MIZU_CONTROL_FILE: mizuroute.control
CALIBRATE_MIZUROUTE: false
MIZUROUTE_TIMEOUT: 3600

# --- Optimization ---
OPTIMIZATION_METHODS:
- iteration
OPTIMIZATION_TARGET: streamflow
CALIBRATION_VARIABLE: streamflow
CALIBRATION_TIMESTEP: daily
ITERATIVE_OPTIMIZATION_ALGORITHM: DDS
OPTIMIZATION_METRIC: KGE
NUMBER_OF_ITERATIONS: 15
POPULATION_SIZE: 10
DDS_R: 0.2
CLEANUP_PARALLEL_DIRS: true
TARGET_METRIC: KGE

# --- Observations ---
STREAMFLOW_DATA_PROVIDER: WSC
SIM_REACH_ID: 228
STATION_ID: 05BB001
STREAMFLOW_PROCESSED_PATH: default

# --- Shapefile conventions (match the source domain) ---
CATCHMENT_SHP_LAT: center_lat
CATCHMENT_SHP_LON: center_lon
CATCHMENT_SHP_AREA: HRU_area
CATCHMENT_SHP_ELEV: elev_mean
CATCHMENT_SHP_HRUID: HRU_ID
CATCHMENT_SHP_GRUID: GRU_ID
