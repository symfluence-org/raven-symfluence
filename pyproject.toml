[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.version]
path = "src/raven_symfluence/_version.py"

# The benchmark directory is dev/reproducibility material (it lives in the GitHub repo) and
# its local config_*.yaml hold machine-specific absolute paths — keep the whole tree out of
# the published sdist/wheel so nothing machine-specific ships to PyPI.
[tool.hatch.build.targets.sdist]
exclude = ["/benchmark", "/tests"]

[tool.hatch.build.targets.wheel]
exclude = ["/benchmark", "/tests"]

[project]
name = "raven-symfluence"
dynamic = ["version"]
description = "Raven hydrological modelling framework -- SYMFLUENCE plugin"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SYMFLUENCE Team", email = "dev@symfluence.org" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

# RavenPy generates the .rv* config files and orchestrates the raven-hydro binary.
# It is imported lazily (inside methods) so the plugin registers without it installed.
dependencies = [
    "symfluence>=0.9.1",
    "numpy",
    "pandas",
    "xarray",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
raven = ["ravenpy>=0.18"]
dev = ["pytest>=7.0", "ruff", "mypy"]

[project.entry-points."symfluence.plugins"]
raven = "raven_symfluence:register"

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that run the real raven binary via RavenPy",
]
